# Worker aparte de la web (Cloudflare Pages no tiene tareas programadas).
# Publicar: npx wrangler deploy --config workers/baja-tarea/wrangler.toml
# Clave: npx wrangler secret put TAREA_SECRET --config workers/baja-tarea/wrangler.toml  (la misma que en Pages)
name = "feehund-baja-tarea"
main = "index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[vars]
URL_WEB = "https://feehund.com"

# Cada hora: envía las programadas del día, recuerda las que siguen sin enviar (una vez al día), trae los justificantes
# (envío automático), devuelve lo que no llega y borra lo que toca. Todo es idempotente: repetirlo no duplica nada.
[triggers]
crons = ["0 * * * *"]
